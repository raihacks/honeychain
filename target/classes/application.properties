spring.application.name=honeychain-backend

# --- MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/honeychain?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=anyasan
spring.datasource.password=siddhi
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080

# --- App / QR ---
# Base URL encoded into each batch's QR code, e.g. https://yourapp.com
# Point this at your real deployed domain before printing labels.
app.base-url=http://localhost:8080

# --- Thymeleaf (disable cache while developing the verify page) ---
spring.thymeleaf.cache=false
